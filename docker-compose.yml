# Runs the help desk plus Caddy, which gets and renews the https certificate automatically.
# Needs a .env file (copy .env.example) with DOMAIN, PUBLIC_URL and STAFF_USERS set.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/helpdesk.db
      TRUST_PROXY: "1"
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - helpdesk-data:/data
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  helpdesk-data:
  caddy-data:
  caddy-config:
